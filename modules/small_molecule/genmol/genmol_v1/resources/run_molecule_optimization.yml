resources:
  jobs:
    run_molecule_optimization:
      name: run_molecule_optimization_gwb

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: run_loop
          max_retries: 0
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/03_run_molecule_optimization.py

      environments:
        - environment_key: default
          spec:
            client: '4'

      # The UI + MCP app SPs get CAN_MANAGE_RUN on this job at registration time via
      # register_molecule_optimization_job.py -> set_app_permissions_for_job, which
      # resolves the SPs by app NAME at runtime and grants additively (survives
      # redeploys). No hardcoded, workspace-specific SP id needed here.

      timeout_seconds: 21600  # 6h hard cap; a typical loop is minutes.

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        # Per-run parameters (populated by start_molecule_optimization_job).
        - name: mlflow_experiment
          default: ""
        - name: mlflow_run_name
          default: ""
        - name: mlflow_run_id
          default: ""
        - name: seed_smiles_csv
          default: ""
        - name: num_samples
          default: "24"
        - name: num_iterations
          default: "5"
        - name: select_top
          default: "3"
        - name: dock_top_k
          default: "5"
        - name: weights_json
          default: '{"qed":1.0,"admet":1.0}'
        - name: temperature
          default: "1.2"
        - name: randomness
          default: "2.0"
        - name: target_sequence
          default: ""
        - name: dock_per_iter
          default: "8"
        - name: dock_samples
          default: "3"

      tags: ${var.common_resource_tags}
