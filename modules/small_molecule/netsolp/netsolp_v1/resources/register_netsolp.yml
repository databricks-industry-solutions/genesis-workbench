resources:
  jobs:
    register_netsolp:
      name: register_netsolp_gwb

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: register_netsolp_solubility
          max_retries: 0
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_register_netsolp.py

      # Serverless CPU (was a classic single-node cpu cluster). The notebook manages its own
      # deps via %pip; serverless removes cluster-create/quota from the deploy path.
      environments:
        - environment_key: default
          spec:
            client: '4'

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: model_name
          default: netsolp_v1
        - name: cache_dir
          default: ${resources.volumes.netsolp_cache_dir.name}
        - name: experiment_name
          default: ${var.module_registration_experiment_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        - name: workload_type
          default: CPU
        - name: weights_path
          default: /Workspace${var.current_working_directory}/files/weights

      tags: ${var.common_resource_tags}
