resources:
  jobs:
    register_chemprop:
      name: register_chemprop

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: pretrained_bbbp_inference
          max_retries: 0
          disable_auto_optimization: true
          environment_key: chemprop_env
          compute:
            hardware_accelerator: "GPU_1xA10"
          notebook_task:
            notebook_path: ../notebooks/01_chemprop_pretrained_inference.py
            base_parameters:
              model_name: chemprop_bbbp
              cache_dir: chemprop_bbbp_cache

        - task_key: toxicity_classifier
          max_retries: 0
          disable_auto_optimization: true
          environment_key: chemprop_env
          compute:
            hardware_accelerator: "GPU_1xA10"
          notebook_task:
            notebook_path: ../notebooks/02_chemprop_toxicity_classifier.py
            base_parameters:
              model_name: chemprop_clintox
              cache_dir: chemprop_clintox_cache

        - task_key: multitask_admet_regressor
          max_retries: 0
          disable_auto_optimization: true
          environment_key: chemprop_admet_env
          compute:
            hardware_accelerator: "GPU_1xA10"
          notebook_task:
            notebook_path: ../notebooks/03_chemprop_multitask_admet.py
            base_parameters:
              model_name: chemprop_admet
              cache_dir: chemprop_admet_cache

      environments:
        - environment_key: chemprop_env
          spec:
            environment_version: "4"
            dependencies:
              - chemprop==2.2.3
              - rdkit==2025.3.6
              - torch==2.7.1
              - lightning==2.6.1
              - mlflow==3.17.2
              - databricks-sdk==0.157.0
              - databricks-sql-connector==4.0.3

        - environment_key: chemprop_admet_env
          spec:
            environment_version: "4"
            dependencies:
              - chemprop==2.2.3
              - rdkit==2025.3.6
              - torch==2.7.1
              - lightning==2.6.1
              - mlflow==3.17.2
              - databricks-sdk==0.157.0
              - databricks-sql-connector==4.0.3
              # NOTE: PyTDC is intentionally NOT an env dependency. Installed unpinned +
              # with deps here, the serverless env builder pulls an old scikit-learn that
              # has no cp312 wheel and fails to compile on py3.12 (env_version 4). The
              # notebook installs it correctly instead: `%pip install --no-deps PyTDC==1.1.15`,
              # relying on scikit-learn>=1.3 (cp312 wheel) below for its runtime needs.
              - scikit-learn==1.6.1

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: experiment_name
          default: ${var.module_registration_experiment_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        - name: workload_type
          default: ${var.gpu_small_setting}

      tags: ${var.common_resource_tags}
