resources:
  jobs:
    register_pltnum:
      name: register_pltnum_gwb

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: register_pltnum_halflife
          max_retries: 0
          disable_auto_optimization: true
          retry_on_timeout: false
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../notebooks/01_register_pltnum.py

      environments:
        - environment_key: gpu_env
          spec:
            client: "4"

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: model_name
          default: pltnum_v1
        - name: cache_dir
          default: ${resources.volumes.pltnum_cache_dir.name}
        - name: experiment_name
          default: ${var.module_registration_experiment_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        - name: workload_type
          default: ${var.gpu_small_setting}
        - name: hf_model_id
          default: sagawa/PLTNUM-ESM2-NIH3T3

      tags: ${var.common_resource_tags}
