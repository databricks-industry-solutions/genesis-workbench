resources:
  jobs:
    ingest_uniprot_genes_job:
      name: dbx_gwb_ingest_uniprot_genes

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: ingest_uniprot_genes_task
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../../notebooks/ingest_uniprot_genes.py
          max_retries: 0

      environments:
        - environment_key: default
          spec:
            client: '4'

      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        # NCBI organism id for the reviewed-proteome ingest (9606 = human).
        - name: organism_id
          default: '9606'

      tags: ${var.common_resource_tags}
