resources:
  jobs:
    build_transformer_engine_job:
      name: dbx_gwb_build_transformer_engine

      email_notifications:
        on_failure:
          - ${var.current_user}

      # Serverless GPU (GPU_1xA10) — the classic A10 GPU cluster can't provision at the
      # workshop's EC2 GPU quota=0. Builds the TE wheel to the libraries Volume so downstream
      # serverless-GPU jobs install it in seconds instead of source-building each run.
      tasks:
        - task_key: build_te_wheel
          max_retries: 0
          disable_auto_optimization: true
          retry_on_timeout: false
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../../notebooks/build_transformer_engine.py

      environments:
        - environment_key: gpu_env
          spec:
            client: "4"

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: te_version
          default: ""

      tags: ${var.common_resource_tags}
