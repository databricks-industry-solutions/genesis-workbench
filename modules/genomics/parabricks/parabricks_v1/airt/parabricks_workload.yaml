# Native AI Runtime workload spec for Parabricks on serverless GPU.
# Submit with: air run --file parabricks_workload.yaml -p <profile>
# `air run` packages the local code dir (this file's directory) into the tarball the
# launcher needs — which the DABs ai_runtime_task couldn't produce ("Tarball not found").
# Uses NVIDIA's STOCK NGC Parabricks image directly: AI Runtime accepts nvcr.io and pulls
# the public image (verified end-to-end), so no Docker Hub mirror, custom Dockerfile, or
# registry credentials are needed. deploy.sh registers it via `air register image` (no creds).
experiment_name: parabricks_airt
compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10
environment:
  docker_image:
    url: nvcr.io/nvidia/clara/clara-parabricks:4.5.1-1
# `air run` only ships a launch stub unless a code_source is declared; without it the
# node's working dir has no run_parabricks.py ("can't open file /mnt/work/run_parabricks.py").
# snapshot tars this dir (root_path: . — invoke `air run` from inside airt/) and extracts it
# to $CODE_SOURCE_PATH (/databricks/code_source/airt). Uncommitted files are included (no git block).
code_source:
  type: snapshot
  snapshot:
    root_path: .
command: |
  cd "$CODE_SOURCE_PATH"
  python3 run_parabricks.py
