resources:
  jobs:
    variant_annotation_initial_setup_job:
      name: dbx_variant_annotation_initial_setup

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: download_clinvar
          max_retries: 0
          job_cluster_key: variant_annotation_setup_cluster
          libraries:
            - jar: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/libraries/glow-spark3-assembly-2.0.4-SNAPSHOT.jar
          notebook_task:
            notebook_path: ../notebooks/00_download_clinvar.py
            source: WORKSPACE

        - task_key: initialize
          disable_auto_optimization: true
          depends_on:
            - task_key: download_clinvar
          # Run on the classic setup cluster (NOT serverless): the ~3.6 GB FASTQ pull
          # from 1000 Genomes stalled on serverless egress and left 0-byte files, while
          # the classic cluster (which download_clinvar already uses successfully) reaches
          # external hosts reliably and has local disk. Reuses the same cluster instance,
          # so no extra cluster start.
          job_cluster_key: variant_annotation_setup_cluster
          notebook_task:
            notebook_path: ../notebooks/initialize.py
          max_retries: 0
          # Ample margin for pip install + the multi-GB FASTQ download; re-runs
          # short-circuit on the size-checked guard in initialize.py.
          timeout_seconds: 3600

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: variant_annotation_job_id
          default: ${resources.jobs.variant_annotation.id}
        - name: variant_annotation_dashboard_id
          default: ${resources.dashboards.variant_annotation_dashboard.id}
        - name: user_email
          default: ${var.current_user}
        - name: databricks_app_names
          default: genesis-workbench:mcp-genesis-workbench

      job_clusters:
        - job_cluster_key: variant_annotation_setup_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-scala2.12
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            node_type_id: ${var.cpu_node_type}
            driver_node_type_id: ${var.cpu_node_type}
            custom_tags:
              ResourceClass: SingleNode
              work_type: variant_annotation_setup
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0

      tags: ${var.common_resource_tags}
