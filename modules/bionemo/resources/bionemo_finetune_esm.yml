# BioNeMo ESM2 fine-tune — serverless GPU. Containerless: a serverless-GPU notebook_task
# (hardware_accelerator: GPU_1xA10) that reads ESM-2 from Hugging Face and runs it on
# Transformer Engine (no NGC container, no classic A10 cluster — both are unavailable at the
# workshop's EC2 GPU quota=0). Deployed once; launched ON DEMAND from the UI (jobs run-now).
resources:
  jobs:
    bionemo_esm_finetune:
      name: bionemo_esm_finetune_job

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: bionemo_esm_finetune_task
          max_retries: 0
          disable_auto_optimization: true
          retry_on_timeout: false
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../notebooks/bionemo_esm_finetune.py

      environments:
        - environment_key: gpu_env
          spec:
            client: "4"

      parameters:
        - name: core_catalog
          default: ${var.core_catalog_name}
        - name: core_schema
          default: ${var.core_schema_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: esm_variant
          default: 650M
        - name: train_data_location
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/bionemo/esm2/ft_data/BLAT_ECOLX_Tenaillon2013_metadata_train.csv
        - name: validation_data_location
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/bionemo/esm2/ft_data/BLAT_ECOLX_Tenaillon2013_metadata_eval.csv
        - name: should_use_lora
          default: "false"
        - name: finetune_label
          default: esm_650m_ft_xyz
        - name: model_volume
          default: ${resources.volumes.bionemo_dir.name}
        - name: task_type
          default: regression
        - name: mlp_ft_dropout
          default: "0.25"
        - name: mlp_hidden_size
          default: "256"
        - name: mlp_target_size
          default: "1"
        - name: experiment_name
          default: sequence_level_regression
        - name: num_steps
          default: "50"
        - name: lr
          default: "5e-3"
        - name: lr_multiplier
          default: "1e2"
        - name: micro_batch_size
          default: "2"
        - name: precision
          default: bf16-mixed
        - name: user_email
          default: a@b.com
        - name: mlflow_run_id
          default: ""

      tags: ${var.common_resource_tags}
