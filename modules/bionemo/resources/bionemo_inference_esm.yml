# BioNeMo ESM2 inference — serverless GPU. Containerless serverless-GPU notebook_task
# (hardware_accelerator: GPU_1xA10) that loads ESM-2 from Hugging Face on Transformer Engine
# and either a fine-tuned head (from bionemo_weights) or a base model. Deployed once; launched
# ON DEMAND from the UI. See bionemo_finetune_esm.yml for the migration notes.
resources:
  jobs:
    bionemo_esm_inference:
      name: bionemo_esm_inference_job

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: bionemo_esm_inference_task
          max_retries: 0
          disable_auto_optimization: true
          retry_on_timeout: false
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../notebooks/bionemo_esm_inference.py

      environments:
        - environment_key: gpu_env
          spec:
            client: "4"

      parameters:
        - name: core_catalog
          default: ${var.core_catalog_name}
        - name: core_schema
          default: ${var.core_schema_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: model_volume
          default: ${resources.volumes.bionemo_dir.name}
        - name: is_base_model
          default: "true"
        - name: esm_variant
          default: 650M
        - name: task_type
          default: regression
        - name: finetune_run_id
          default: "3"
        - name: data_location
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/bionemo/esm2/ft_data/BLAT_ECOLX_Tenaillon2013_metadata_train.csv
        - name: sequence_column_name
          default: sequence
        - name: result_location
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/bionemo/esm2/ft_data
        - name: user_email
          default: a@b.com
        - name: experiment_name
          default: gwb_bionemo_esm2_inference
        - name: run_name
          default: esm2_inference
        - name: mlflow_run_id
          default: ""

      tags: ${var.common_resource_tags}
