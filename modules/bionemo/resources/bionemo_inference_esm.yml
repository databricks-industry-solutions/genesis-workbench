# BioNeMo ESM2 inference — serverless GPU ai_runtime_task (stock NGC BioNeMo image), replacing
# the classic a10 GPU cluster. Deployed once; launched ON DEMAND from the UI. See
# bionemo_finetune_esm.yml for the code-delivery / patch notes.
resources:
  jobs:
    bionemo_esm_inference:
      name: bionemo_esm_inference_job

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: bionemo_esm_inference_task
          max_retries: 0
          environment_key: airt
          ai_runtime_task:
            experiment: bionemo_esm_inference
            code_source_path: ./dist/code.tgz
            docker_image_url: nvcr.io/nvidia/clara/bionemo-framework:2.6.1
            deployments:
              - command_path: /Workspace/Shared/bionemo/command_inference.sh
                compute:
                  accelerator_type: GPU_1xA10
                  accelerator_count: 1

      environments:
        - environment_key: airt
          spec:
            environment_version: '6'

      parameters:
        - name: core_catalog
          default: ${var.core_catalog_name}
        - name: core_schema
          default: ${var.core_schema_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: is_base_model
          default: true
        - name: esm_variant
          default: 650M
        - name: task_type
          default: regression
        - name: finetune_run_id
          default: 3
        - name: data_location
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/bionemo/esm2/ft_data/BLAT_ECOLX_Tenaillon2013_metadata_train.csv
        - name: sequence_column_name
          default: sequence
        - name: result_location
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/bionemo/esm2/ft_data
        - name: user_email
          default: a@b.com
        - name: experiment_name
          default: gwb_bionemo_esm2_inference
        - name: run_name
          default: esm2_inference
        - name: mlflow_run_id
          default: ''

      tags: ${var.common_resource_tags}
