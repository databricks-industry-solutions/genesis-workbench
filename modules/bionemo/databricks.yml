bundle:
  name: genesis_workbench_bionemo
  databricks_cli_version: ">=0.295.*"

include:
  - variables.yml
  - resources/*.yml

# Packages airt/ (run_finetune.py + run_inference.py + command_*.sh + the patched
# finetune_esm2.py) into ./dist/code.tgz for the ai_runtime_task code_source_path.
artifacts:
  bionemo_code:
    type: tgz
    path: .
    include:
      - airt
    files:
      - source: ./dist/code.tgz

sync:
  paths:
    - .
  
targets:
  prod:
    mode: production
    default: true
    workspace:
      root_path: ${var.current_working_directory}
       #host: this will be read by DATABRICKS_HOST env variable
    permissions:
      - user_name: ${var.current_user}
        level: CAN_MANAGE
    run_as:
      user_name: ${var.current_user} #sp name should be used instead later.

