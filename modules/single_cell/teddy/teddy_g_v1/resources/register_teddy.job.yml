resources:
  jobs:
    register_teddy:
      name: register_teddy

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        # 1) Register the TEDDY model + tokenizer + HF snapshot into UC.
        - task_key: register_teddy_task
          max_retries: 0
          disable_auto_optimization: true
          retry_on_timeout: false
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../notebooks/01_register_teddy.py

        # 2) Import the UC model into GWB + deploy serving endpoint.
        - task_key: import_teddy_model_task
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: "register_teddy_task"
          notebook_task:
            notebook_path: ../notebooks/02_import_model_gwb.py

        # 3) Extract HGNC→ENSG gene mapping from CELLxGENE Census. Runs in
        # parallel with steps 1/2 — only depends on the cache volume existing.
        - task_key: extract_gene_mapping_task
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: "register_teddy_task"
          notebook_task:
            notebook_path: ../notebooks/06_extract_gene_mapping.py

        # 4a) STAGE: fetch the Census X for a stratified subset ONCE and precompute the TEDDY
        # top-k gene tokens to a Volume (03a). This is the network-bound part, split out so the
        # GPU embed (4b) no longer idle-waits on per-batch get_anndata (the old ~6k cells/min
        # bottleneck). Resumable — a re-run fetches only the soma_joinids not already tokenized,
        # so an interrupted stage never loses progress.
        - task_key: stage_reference_task
          # H100 serverless (client '6'): the A10 serverless-GPU Ray cluster won't start on this
          # workshop (RayInitializationError); H100 is the reliably-provisioned pool here. H100
          # compute-start can exceed 900s, so retry. ray_launch(gpu_type="h100") × num_gpu_workers=8.
          max_retries: 2
          disable_auto_optimization: true
          retry_on_timeout: false
          depends_on:
            - task_key: "register_teddy_task"
          environment_key: gpu_env_h100
          compute:
            hardware_accelerator: GPU_1xH100
          notebook_task:
            notebook_path: ../notebooks/03a_stage_reference.py

        # 4b) EMBED: Ray reads the LOCAL staged tokens (no Census) and runs a pure TEDDY forward
        # into the reference Delta `teddy_cells`. GPU-bound → scales ~linearly with
        # `num_gpu_workers`. Idempotent — skips if teddy_cells is already populated at target+dim.
        - task_key: reembed_reference_task
          # H100 serverless (client '6'): A10 Ray cluster won't start here; H100 is the reliably
          # provisioned pool. H100 compute-start can exceed 900s, so retry. ray_launch(gpu_type="h100")
          # × num_gpu_workers=8. Idempotent — skips if teddy_cells is already populated at target+dim.
          max_retries: 2
          disable_auto_optimization: true
          retry_on_timeout: false
          depends_on:
            - task_key: "stage_reference_task"
          environment_key: gpu_env_h100
          compute:
            hardware_accelerator: GPU_1xH100
          notebook_task:
            notebook_path: ../notebooks/03b_embed_reference_ray.py

        # 5) Create/sync the Vector Search index over teddy_cells. Idempotent
        # — detects existing index and triggers sync_index() instead.
        # NB: gwb_teddy_vs_endpoint + teddy_cell_index + teddy_cells are
        # ALL preserved across `databricks bundle destroy` (not bundle
        # resources). See README.
        - task_key: create_vs_index_task
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: "reembed_reference_task"
          notebook_task:
            notebook_path: ../notebooks/04_create_teddy_vs_index.py

      environments: ## serverless
        - environment_key: default
          spec:
            client: '2'
        - environment_key: gpu_env
          spec:
            client: '4'
        # H100 serverless (AI Runtime v6 / CUDA 13) for the Ray stage + embed tasks — the A10
        # Ray cluster won't start on this workshop; H100 is the reliably-provisioned pool here.
        - environment_key: gpu_env_h100
          spec:
            client: '6'

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: model_name
          default: teddy
        - name: cache_dir
          default: ${resources.volumes.teddy_cache_dir.name}
        - name: experiment_name
          default: ${var.module_registration_experiment_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        - name: workload_type
          default: ${var.gpu_medium_setting}
        - name: teddy_hf_repo
          default: ${var.teddy_hf_repo}
        - name: teddy_hf_revision
          default: ${var.teddy_hf_revision}
        - name: teddy_model_size
          default: ${var.teddy_model_size}
        # Reembed reference parameters
        - name: target_n_cells
          default: ${var.teddy_reembed_target_n_cells}
        - name: per_stratum_cap
          default: ${var.teddy_reembed_per_stratum_cap}
        - name: census_version
          default: ${var.teddy_reembed_census_version}
        # Number of single-H100 serverless-GPU Ray workers for the stage + reembed
        # (serverless_gpu.ray.ray_launch provisions this many H100 nodes; A10 Ray
        # won't start on this workshop).
        - name: num_gpu_workers
          default: "8"

      timeout_seconds: 43200  # 12h hard cap — covers the 5-8h reembed plus
                              # mapping, register, and serving deploy overhead.

      tags: ${var.common_resource_tags}
