resources:
  jobs:
    register_scgpt:
      name: register_scgpt

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: register_scgpt_task
          max_retries: 0
          disable_auto_optimization: true
          retry_on_timeout: false
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../notebooks/01_register_scgpt.py

        #this task need serverless runtime with python 3.11
        - task_key: update_model_catalog_scgpt_models_task
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: "register_scgpt_task"
          notebook_task:
            notebook_path: ../notebooks/02_import_model_gwb.py

        # Perturbation model — reuses same weights, different PyFunc wrapper
        # Uses its own parameter (perturb_model_name) to avoid colliding with
        # the job-level model_name=scgpt used by the embedding model
        - task_key: register_scgpt_perturbation_task
          max_retries: 0
          disable_auto_optimization: true
          retry_on_timeout: false
          depends_on:
            - task_key: "register_scgpt_task"
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../notebooks/03_register_scgpt_perturbation.py

        - task_key: import_scgpt_perturbation_task
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: "register_scgpt_perturbation_task"
          notebook_task:
            notebook_path: ../notebooks/04_import_perturbation_gwb.py

      environments: ## serverless
        - environment_key: default
          spec:
            client: '2'
        - environment_key: gpu_env
          spec:
            client: '4'

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
          #default: ${var.module_schema_name}
        - name: model_name
          default: scgpt
        - name: perturb_model_name
          default: scgpt_perturbation
        - name: cache_dir
          default: ${resources.volumes.scgpt_cache_dir.name}
        - name: experiment_name
          default: ${var.module_registration_experiment_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        - name: workload_type
          default: ${var.gpu_large_setting}

      tags: ${var.common_resource_tags}