name: rfd3-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Serving Python MUST match the logging runtime (serverless GPU AI runtime =
  # Python 3.12). The RFD3 pyfunc is defined INLINE in the register notebook, so
  # cloudpickle serializes it BY VALUE; a different serving minor (e.g. 3.11) would
  # segfault the model server on load (see the protein_mpnn migration notes).
  - python=3.12
  - pip
  - pip:
    # rc-foundry (RFdiffusion3 / RFD3) is NOT on the Databricks private pypi-proxy,
    # so point the serving build at public PyPI. Verified: the serving container
    # build reaches + installs it. rc-foundry pulls a CUDA-enabled torch from PyPI
    # (default linux wheels are cu-enabled), so RFD3 uses the A10 GPU at serving.
    - --extra-index-url https://pypi.org/simple
    - rc-foundry
    - biopython
    # mlflow/cloudpickle MUST match the logging runtime or the serving container
    # fails to unpickle the model ("Phase: mlflow_parse ... AttributeError").
    - mlflow==2.22.0
    - cloudpickle==3.0.0
