[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinmpnn"
version = "0.1.0"
authors = [{name = "Peter Hawkins", email = "peter.hawkins@databricks.com"}]
description = "proteinMPNN adapted for pip install"
dependencies = [
  # Match the serverless GPU AI runtime (and the serving conda_env). Old
  # 2.15.1/2.2.1 pins would downgrade the logging env and desync serving,
  # breaking model unpickling in the serving container. See esmfold/boltz notes.
  "mlflow==2.22.0",
  "cloudpickle==3.0.0",
]

[tool.setuptools]
packages = ["proteinmpnn"]
package-dir = {"" = "src"}