resources:
  jobs:
    sequence_search_workflow:
      name: sequence_search_workflow

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:

        - task_key: download_sequences
          max_retries: 0
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/01_download_sequences.py
            source: WORKSPACE

        - task_key: create_delta_tables
          max_retries: 0
          depends_on:
            - task_key: download_sequences
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_create_delta_tables.py
            source: WORKSPACE

        # Serverless GPU + Ray: `serverless_gpu.ray.ray_launch(gpus=num_gpu_workers)`
        # fans the ESM-2 embed across N A10 workers (default 4) — Ray Data stages the
        # corpus to a UC Volume, embeds in parallel, and CTAS-promotes to the managed
        # `sequence_embeddings` table. Draws from the managed serverless-GPU pool, not
        # the account's EC2 GPU vCPU quota (which blocked the old classic 4×A10
        # multi_gpu_cluster). max_sequences caps the corpus. The single-A10 variant is
        # kept at 03_batch_embed_sequences_sgc.py for small-corpus / fallback runs.
        - task_key: batch_embed_sequences
          # H100 serverless (client '6'): the A10 serverless-GPU Ray cluster won't start on this
          # workshop (RayInitializationError), whereas H100 is the reliably-provisioned pool here
          # (same as the RFD4 / antibody / vaccine jobs). ray_launch(gpu_type="h100") fans the embed
          # across num_gpu_workers=8 H100s. H100 compute-start can exceed 900s, so retry.
          max_retries: 2
          depends_on:
            - task_key: create_delta_tables
          environment_key: gpu_env_h100
          disable_auto_optimization: true
          retry_on_timeout: false
          compute:
            hardware_accelerator: GPU_1xH100
          notebook_task:
            notebook_path: ../notebooks/03_batch_embed_sequences_ray.py
            source: WORKSPACE

        - task_key: create_vector_index
          max_retries: 0
          depends_on:
            - task_key: batch_embed_sequences
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/04_create_vector_index.py
            source: WORKSPACE

        # Human SwissProt companion index. gene_sequences is built by core's
        # ingest_uniprot_genes.py; we embed it (same ESM-2 model as UniRef) and
        # index it so protein search also returns human targets (e.g. PARP1).
        # ~20K rows → embed on the single A10 the task lands on (no fan-out needed).
        # Chained after batch_embed_sequences to serialise serverless-GPU use.
        - task_key: embed_gene_sequences
          max_retries: 0
          depends_on:
            - task_key: batch_embed_sequences
          environment_key: gpu_env
          disable_auto_optimization: true
          retry_on_timeout: false
          compute:
            hardware_accelerator: GPU_1xA10
          notebook_task:
            notebook_path: ../notebooks/05_batch_embed_gene_sequences_sgc.py
            source: WORKSPACE

        - task_key: create_gene_vector_index
          max_retries: 0
          depends_on:
            - task_key: embed_gene_sequences
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/06_create_gene_vector_index.py
            source: WORKSPACE

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: volume_name
          default: ${resources.volumes.sequence_search_volume.name}
        - name: user_email
          default: ${var.current_user}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        # Batch-embed corpus cap (03). Production default; override per-run to cap
        # the corpus (e.g. for a quick verification run).
        - name: max_sequences
          default: "1000000"
        # Ray embed fan-out width (03) — number of H100 serverless-GPU workers.
        - name: num_gpu_workers
          default: "8"

      # Serverless GPU environment for the two embedding tasks (client "4" matches
      # the register jobs' serverless GPU AI runtime). Default CPU environment for
      # the remaining tasks.
      environments:
        - environment_key: default
          spec:
            client: "4"
        - environment_key: gpu_env
          spec:
            client: "4"
        # H100 serverless (AI Runtime v6 / CUDA 13) for the Ray batch-embed — the A10 Ray
        # cluster won't start on this workshop; H100 is the reliably-provisioned pool here.
        - environment_key: gpu_env_h100
          spec:
            client: '6'

      tags: ${var.common_resource_tags}

      queue:
        enabled: true
