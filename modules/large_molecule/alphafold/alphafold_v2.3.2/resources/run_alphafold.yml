resources:
  jobs:
    alphafold:
      name: run_alphafold
      description: >
        # Alphafold_v2.3.2 workflow
        inputs:
         - protein: protein sequence. For multimer separate chains with colon, e.g CAS:CAR.
         - run_name: a name for the run
      email_notifications:
        on_failure:
          - ${var.current_user}
        on_duration_warning_threshold_exceeded:
          - ${var.current_user}
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
      timeout_seconds: 86400
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 50400
      max_concurrent_runs: 5

      tasks:
        - task_key: featurize
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/run_alphafold_featurize.py
            source: WORKSPACE
          environment_key: cpu_env
          disable_auto_optimization: true
          retry_on_timeout: false
          timeout_seconds: 28800
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 14400
          email_notifications:
            on_failure:
              - ${var.current_user}
            on_duration_warning_threshold_exceeded:
              - ${var.current_user}
          notification_settings:
            no_alert_for_skipped_runs: true
            no_alert_for_canceled_runs: true
            alert_on_last_attempt: true

        - task_key: fold
          max_retries: 0
          depends_on:
            - task_key: featurize
          notebook_task:
            notebook_path: ../notebooks/run_alphafold_fold.py
            source: WORKSPACE
          environment_key: gpu_env
          compute:
            hardware_accelerator: GPU_1xA10
          disable_auto_optimization: true
          retry_on_timeout: false
          timeout_seconds: 14400
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 3600
          email_notifications:
            on_failure:
              - ${var.current_user}
            on_duration_warning_threshold_exceeded:
              - ${var.current_user}
          notification_settings:
            no_alert_for_skipped_runs: true
            no_alert_for_canceled_runs: true
            alert_on_last_attempt: true

        - task_key: mark_success
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: fold
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../notebooks/update_mlflow_status.py
            source: WORKSPACE
            base_parameters:
              mlflow_run_id: "{{job.parameters.run_id}}"
              job_status: "fold_complete"
          environment_key: default

        - task_key: mark_failure
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: fold
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/update_mlflow_status.py
            source: WORKSPACE
            base_parameters:
              mlflow_run_id: "{{job.parameters.run_id}}"
              job_status: "failed"
          environment_key: default

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: model_volume
          default: alphafold
        - name: user_email
          default: ${var.current_user}      
        - name: protein_sequence
          default: XXX
        - name: run_id
          default: run
        # Serverless featurize/fold tuning (defaults; the GWB app passes only the
        # five params above, so these take effect via their defaults).
        - name: max_msa_seqs
          default: "2000000"
        - name: fold_models
          default: model_3_ptm,model_4_ptm,model_5_ptm
        - name: num_recycle
          default: "3"


      # Serverless: featurize on serverless CPU (cpu_env), fold on serverless GPU
      # (gpu_env / GPU_1xA10). No classic job_clusters — draws from the managed
      # serverless pools instead of the account's EC2 GPU vCPU quota.
      environments:
        - environment_key: default
          spec:
            client: '4'
        - environment_key: cpu_env
          spec:
            client: '4'
        - environment_key: gpu_env
          spec:
            client: '4'

      tags: ${var.common_resource_tags}

      queue:
        enabled: true
      
