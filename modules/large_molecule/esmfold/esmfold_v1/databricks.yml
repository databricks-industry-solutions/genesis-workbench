bundle:
  name: genesis_workbench_esmfold
  databricks_cli_version: ">=0.236.*"

include:
  - variables.yml
  - resources/*.yml

targets:
  # Serverless GPU tasks (see resources/register_esm_fold.job.yml) need no
  # per-target job_cluster / cloud-attribute overrides. Mirrors esm2_embeddings.
  prod_aws:
    mode: production
    default: true
    workspace:
      root_path: ${var.current_working_directory}
    permissions:
      - user_name: ${var.current_user}
        level: CAN_MANAGE
    run_as:
      user_name: ${var.current_user}

  prod_azure:
    mode: production
    workspace:
      root_path: ${var.current_working_directory}
    permissions:
      - user_name: ${var.current_user}
        level: CAN_MANAGE
    run_as:
      user_name: ${var.current_user}

  prod_gcp:
    mode: production
    workspace:
      root_path: ${var.current_working_directory}
    permissions:
      - user_name: ${var.current_user}
        level: CAN_MANAGE
    run_as:
      user_name: ${var.current_user}
