resources:
  jobs:
    register_esm_fold:
      name: register_esmfold

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        # Serverless GPU (GPU_1xA10). Registration downloads the ESMFold weights
        # and logs the pyfunc; the .cuda() calls run on the serving endpoint, not
        # here. Serverless GPU draws from the Databricks-managed pool, so it is not
        # blocked by the account's classic-cluster EC2 vCPU quota. Mirrors the
        # esm2_embeddings register job. A10 (24 GB) ≥ the old T4.
        - task_key: deploy_esm_task
          disable_auto_optimization: true
          environment_key: gpu_env
          max_retries: 0
          retry_on_timeout: false
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../notebooks/01_register_esmfold.py
          compute:
            hardware_accelerator: GPU_1xA10

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: model_name
          default: esmfold
        - name: cache_dir
          default: ${resources.volumes.esm2_cache_dir.name}
        - name: experiment_name
          default: ${var.module_registration_experiment_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        - name: workload_type
          # A10 (24 GB) — ESMFold OOMs a T4/GPU_SMALL on longer (e.g. human) proteins.
          default: ${var.gpu_medium_setting}


      environments:
        - environment_key: gpu_env
          spec:
            client: "4"

      tags: ${var.common_resource_tags}
