resources:
  jobs:
    register_boltz:
      name: register_boltz

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        # Serverless GPU (GPU_1xA10). The notebook self-installs dbboltz[gpu]
        # (modern torch). Bypasses the classic-cluster EC2 GPU vCPU quota.
        # Mirrors esm2_embeddings. (Authors already wanted serverless py3.11 here.)
        - task_key: register_boltz_task
          disable_auto_optimization: true
          environment_key: gpu_env
          max_retries: 0
          retry_on_timeout: false
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../notebooks/01_register_boltz.py
          compute:
            hardware_accelerator: GPU_1xA10
            
      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: model_name
          default: boltz
        - name: cache_dir
          default: ${resources.volumes.boltz_cache_dir.name}
        - name: experiment_name
          default: ${var.module_registration_experiment_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: user_email
          default: ${var.current_user}
        - name: workload_type
          default: ${var.gpu_small_setting}

      environments:
        - environment_key: gpu_env
          spec:
            client: "4"

      tags: ${var.common_resource_tags}
            
            